services:
  ollama:
    volumes:
      - /mnt/bigData/ollama/ollama:/root/.ollama
      - /mnt/bigData/lmstudio:/lmstudio
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  ollama-webui:
    volumes:
      - /mnt/bigData/ollama/ollama-webui:/app/backend/data
    restart: unless-stopped
    networks:
      - ollama-docker
